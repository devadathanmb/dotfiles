import = ["/home/devadathan/.config/alacritty/vscode.toml"]

[cursor.style]
blinking = "always"
shape = "Beam"

[env]
TERM = "xterm-256color"

[font]
size = 12.2

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[shell]
program = "/usr/bin/zsh"

[window]
decorations = "full"
opacity = 1.00

[window.dimensions]
columns = 113
lines = 30

[window.padding]
x = 12
y = 12
